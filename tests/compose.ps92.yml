services:
  database:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: prestashop
      MARIADB_USER: prestashop
      MARIADB_PASSWORD: prestashop-test
      MARIADB_ROOT_PASSWORD: prestashop-root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
  prestashop:
    image: prestashop/prestashop:9.2.0-8.5
    command:
      - sh
      - -c
      - sed -i 's#rm -r /var/www/html/$$PS_FOLDER_INSTALL/#rm -rf /var/www/html/$$PS_FOLDER_INSTALL/#' /tmp/docker_run.sh && exec /tmp/docker_run.sh
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:19105:80"
    environment:
      DB_SERVER: database
      DB_NAME: prestashop
      DB_USER: prestashop
      DB_PASSWD: prestashop-test
      PS_INSTALL_AUTO: 1
      PS_DOMAIN: localhost:19105
      PS_DEV_MODE: 0
      PS_ENABLE_SSL: 0
      PS_FOLDER_ADMIN: admin-dev
      ADMIN_MAIL: demo@prestashop.local
      ADMIN_PASSWD: PrestaShop92!
    volumes:
      - ../:/module:ro
